[project]
name = "loci"
version = "0.1.0"
description = "0xL0C1 — a method-of-loci agent for the physical world. Memory lives on the object, not the app."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.14.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.18",
    "pytest>=8",
    "pytest-xdist>=3.8",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["server.py", "db.py"]
strict = true
